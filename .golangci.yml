run:
  timeout: 3m
  tests: true
  go: "1.26"

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - gocritic
    - bodyclose
    - errorlint
    - noctx
    - contextcheck
    - unconvert
    - unparam
    - prealloc

linters-settings:
  revive:
    rules:
      - name: exported
      - name: var-naming
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - unparam
  max-issues-per-linter: 0
  max-same-issues: 0